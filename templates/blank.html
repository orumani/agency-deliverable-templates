<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Document Title]: [Client Name]</title>
    <link rel="stylesheet" href="../styles/deliverable.css">
    <style>
        :root {
            --accent: var(--color-strategy);
            --accent-bg: var(--color-strategy-bg);
        }
        /* File-specific styles only below this line */
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="header-badge">Strategy</span>
        <h1>[Document Title]</h1>
        <p>[Client Name]</p>
        <div class="report-meta">
            <span>Prepared by [Author Name, Role]</span>
            <span>[Month Day, Year]</span>
            <span>[Your Agency]</span>
        </div>
    </div>

    <h2 class="section-title">Executive Summary</h2>
    <div class="exec-summary">
        <h3>Key Findings</h3>
        <ul>
            <li>[Finding one]</li>
            <li>[Finding two]</li>
            <li>[Finding three]</li>
        </ul>
    </div>

    <div class="section">
        <h2 class="section-title">[Section Title]</h2>
        <p class="section-text">[Section content]</p>
    </div>

    <div class="doc-footer">
        <p>[Month Day, Year]. Prepared by [Your Agency] for [Client Name].</p>
    </div>
</div>

</body>
</html>
